<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cris Nunes 5010</title>

<meta name="description" content="Cris Nunes 5010 para deputada federal em Minas Gerais.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Great+Vibes&display=swap">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    background:#ff6a00;
}

body{
    font-family:'Montserrat',sans-serif;
    background:linear-gradient(
        135deg,
        #ff9f00 0%,
        #ff6a00 20%,
        #ff1765 60%,
        #b400ff 100%
    );
    min-height:100vh;
    overflow-x:hidden;
}

.hero{
    position:relative;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    align-items:center;
    padding:clamp(24px, 5vw, 64px);
    overflow:hidden;
    isolation:isolate;
}

/* Raios de fundo */
.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    repeating-conic-gradient(
        from 0deg,
        rgba(255,255,255,.12) 0deg,
        rgba(255,255,255,.12) 2deg,
        transparent 2deg,
        transparent 12deg
    );
    transform:scale(2);
    opacity:.5;
    z-index:-1;
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    width:100%;
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns:minmax(0, .95fr) minmax(0, 1.05fr);
    align-items:center;
    gap:clamp(32px, 5vw, 80px);
}

.photo{
    text-align:center;
    margin:0;
}

.photo img{
    width:100%;
    max-width:700px;
    height:auto;
    display:block;
    margin:auto;
    border-radius:20px;
    filter:drop-shadow(0 20px 60px rgba(0,0,0,.35));
}

.text{
    color:white;
}

.logo{
    color:#ffdd00;
    font-weight:900;
    line-height:1;
    margin-bottom:30px;
}

.logo .sigla{
    font-size:clamp(2.75rem, 5vw, 4rem);
}

.logo .fed{
    font-size:clamp(.9rem, 2vw, 1.75rem);
}

.slogan{
    text-transform:uppercase;
    font-weight:800;
    font-size:clamp(1.35rem, 2.7vw, 2.375rem);
    margin-bottom:30px;
    line-height:1.2;
}

.slogan span{
    color:#ffd400;
}

.nome-script{
    font-family:'Great Vibes',cursive;
    display:block;
    font-size:clamp(4rem, 8vw, 7.5rem);
    line-height:1;
}

.nome{
    display:block;
    font-size:clamp(4rem, 8vw, 7.5rem);
    font-weight:900;
    line-height:.9;
    text-transform:uppercase;
    overflow-wrap:break-word;
}

.cargo{
    display:inline-block;
    background:#6620b3;
    max-width:100%;
    padding:12px clamp(16px, 3vw, 30px);
    border-radius:8px;
    margin-top:10px;
    font-weight:800;
    letter-spacing:clamp(1px, .3vw, 4px);
    font-size:clamp(1rem, 2vw, 1.625rem);
}

.numero{
    margin-top:20px;
    font-size:clamp(6rem, 14vw, 11.25rem);
    font-weight:900;
    line-height:1;
    overflow-wrap:break-word;

    background:linear-gradient(
        90deg,
        #ffb400,
        #ff0066,
        #295cff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 6px 25px rgba(0,0,0,.2);
}

.partido{
    font-size:clamp(2rem, 4vw, 3.25rem);
    font-weight:900;
}

.partido span{
    color:#fff000;
}

.footer-info{
    position:absolute;
    left:15px;
    bottom:24px;
    transform:rotate(-90deg);
    transform-origin:left bottom;
    color:white;
    font-size:clamp(.65rem, 1vw, 1.125rem);
    opacity:.9;
    white-space:nowrap;
}

@media(max-width:1100px){

.hero-content{
    grid-template-columns:1fr;
    text-align:center;
}

.text{
    text-align:center;
}

.footer-info{
    display:none;
}
}

@media(max-width:600px){

.hero{
    padding:24px 16px 36px;
}

.hero-content{
    gap:28px;
}

.photo img{
    border-radius:14px;
}

.logo{
    margin-bottom:22px;
}

.slogan{
    margin-bottom:24px;
}

.cargo{
    letter-spacing:1px;
}

.numero{
    margin-top:16px;
}
}
</style>
</head>

<body>

<main>
<section class="hero" aria-labelledby="campaign-title">

<p class="footer-info">
Eleição 2026 • Cris Nunes • Deputada Federal • CNPJ: 68.438.374/0001-27
</p>

<div class="hero-content">

<figure class="photo">
<img src="foto-cris-nunes.jpg" alt="Cris Nunes, candidata a deputada federal">
</figure>

<div class="text">
<div class="logo">
<div class="sigla">PSOL</div>
<div class="fed">FEDERAÇÃO PSOL • REDE</div>
</div>

<p class="slogan">
CORAGEM PARA <span>TRANSFORMAR</span>.<br>
EXPERIÊNCIA PARA <span>REPRESENTAR</span>.
</p>

<h1 id="campaign-title">
<span class="nome-script">Cris</span>

<span class="nome">
NUNES
</span>
</h1>

<p class="cargo">
DEPUTADA FEDERAL
</p>

<p class="numero" aria-label="Número de urna 5010">
5010
</p>

<p class="partido">
PSOL <span>MG</span>
 </p>

</div>
</div>

</section>
</main>

</body>
</html>
