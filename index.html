<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cris Nunes 5010</title>

<meta name="description" content="Cris Nunes 5010 para deputada federal em Minas Gerais.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    background:#ff6a00;
}

body{
    background:linear-gradient(
        135deg,
        #ff9f00 0%,
        #ff6a00 20%,
        #ff1765 60%,
        #b400ff 100%
    );
    min-height:100vh;
    overflow-x:hidden;
}

.hero{
    position:relative;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    align-items:center;
    padding:clamp(24px, 5vw, 64px);
    overflow:hidden;
    isolation:isolate;
}

/* Raios de fundo */
.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    repeating-conic-gradient(
        from 0deg,
        rgba(255,255,255,.12) 0deg,
        rgba(255,255,255,.12) 2deg,
        transparent 2deg,
        transparent 12deg
    );
    transform:scale(2);
    opacity:.5;
    z-index:-1;
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    width:min(100%, 920px);
    margin:auto;
}

.photo{
    width:100%;
    max-width:919px;
    margin:0;
}

.photo img{
    width:100%;
    aspect-ratio:919 / 914;
    height:auto;
    display:block;
    margin:auto;
    border-radius:20px;
    object-fit:contain;
    filter:drop-shadow(0 20px 60px rgba(0,0,0,.35));
}

.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0, 0, 0, 0);
    white-space:nowrap;
    border:0;
}

.footer-info{
    position:absolute;
    left:15px;
    bottom:24px;
    transform:rotate(-90deg);
    transform-origin:left bottom;
    color:white;
    font-size:clamp(.65rem, 1vw, 1.125rem);
    opacity:.9;
    white-space:nowrap;
}

@media(max-width:600px){

.footer-info{
    display:none;
}

.hero{
    padding:16px;
}

.photo img{
    border-radius:14px;
}
}
</style>
</head>

<body>

<main>
<section class="hero" aria-labelledby="campaign-title">

<p class="footer-info">
Eleição 2026 • Cris Nunes • Deputada Federal • CNPJ: 68.438.374/0001-27
</p>

<h1 id="campaign-title" class="sr-only">Cris Nunes 5010 para deputada federal</h1>

<div class="hero-content">

<figure class="photo">
<img src="img/foto-cris-nunes.jpg" width="919" height="914" alt="Material de campanha de Cris Nunes para deputada federal, com o número 5010 e PSOL MG" fetchpriority="high">
<figcaption class="sr-only">Cris Nunes, candidata a deputada federal em Minas Gerais, com o slogan Coragem para transformar. Experiência para representar.</figcaption>
</figure>

</div>

</section>
</main>

</body>
</html>
